name: Build macOS DMG (Full Project Installer)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller dmgbuild

      - name: Build standalone app
        run: |
          echo "🚧 Собираем MusicLotoMaker.app..."
          pyinstaller --noconfirm --windowed --name "MusicLotoMaker" app.py
          echo "✅ Сборка завершена"

      - name: Prepare DMG directory
        run: |
          mkdir -p dist_project

          # Копируем нужные папки
          cp -R frontend backend assets game_templates templates covers dist_project/ 2>/dev/null || true

          # Копируем основные файлы
          cp -R *.py *.txt *.json *.pptx dist_project/ 2>/dev/null || true

          # Добавляем скомпилированное приложение
          cp -R dist/MusicLotoMaker.app dist_project/

          # Создаём стартовый скрипт
          echo '#!/bin/bash' > dist_project/start.command
          echo 'cd "$(dirname "$0")"' >> dist_project/start.command
          echo 'echo "🚀 Запуск MusicLotoMaker..."' >> dist_project/start.command
          echo './MusicLotoMaker.app/Contents/MacOS/MusicLotoMaker' >> dist_project/start.command
          chmod +x dist_project/start.command

          echo "MusicLotoMaker for macOS" > dist_project/README.txt
          echo "✅ Папка dist_project готова"

      - name: Create dmg_settings.py
        run: |
          echo "files = ['dist_project']" > dmg_settings.py
          echo "format = 'UDBZ'" >> dmg_settings.py
          echo "symlinks = {'Applications': '/Applications'}" >> dmg_settings.py
          echo "window_rect = ((100, 100), (640, 480))" >> dmg_settings.py
          echo "icon_size = 128" >> dmg_settings.py

      - name: Build DMG
        run: |
          dmgbuild -s dmg_settings.py "MusicLotoMaker" "MusicLotoMaker.dmg"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicLotoMaker-dmg
          path: MusicLotoMaker.dmg
