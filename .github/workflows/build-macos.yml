name: Build macOS Universal2 DMG COMPLETE FIX

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller dmgbuild

      - name: Build x86_64 app
        run: |
          echo "🚧 Building MusicLotoMaker.app for x86_64..."
          rm -rf dist build dist_x86_64
          python -m venv venv_x86
          arch -x86_64 ./venv_x86/bin/pip install -r requirements.txt
          arch -x86_64 ./venv_x86/bin/pyinstaller \
            --noconfirm \
            --windowed \
            --name "MusicLotoMaker" \
            --clean \
            --onedir \
            app.py
          mkdir -p dist_x86_64
          mv dist/MusicLotoMaker.app dist_x86_64/
          echo "✅ x86_64 build done"

      - name: Build arm64 app
        run: |
          echo "🚧 Building MusicLotoMaker.app for arm64..."
          rm -rf dist build dist_arm64
          python -m venv venv_arm
          arch -arm64 ./venv_arm/bin/pip install -r requirements.txt
          arch -arm64 ./venv_arm/bin/pyinstaller \
            --noconfirm \
            --windowed \
            --name "MusicLotoMaker" \
            --clean \
            --onedir \
            app.py
          mkdir -p dist_arm64
          mv dist/MusicLotoMaker.app dist_arm64/
          echo "✅ arm64 build done"

      - name: Create Universal2 app COMPLETE FIX
        run: |
          echo "🚀 Creating BULLETPROOF Universal2 MusicLotoMaker.app..."
          rm -rf dist
          
          # Создаём структуру приложения
          mkdir -p dist/MusicLotoMaker.app/Contents/MacOS
          mkdir -p dist/MusicLotoMaker.app/Contents/Resources
          mkdir -p dist/MusicLotoMaker.app/Contents/Frameworks
          
          # 1. Копируем Info.plist и добавляем правильные настройки
          cat > dist/MusicLotoMaker.app/Contents/Info.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>MusicLotoMaker</string>
              <key>CFBundleDisplayName</key>
              <string>MusicLotoMaker</string>
              <key>CFBundleIdentifier</key>
              <string>com.musiclotomaker.app</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleSignature</key>
              <string>????</string>
              <key>CFBundleExecutable</key>
              <string>MusicLotoMaker</string>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.15</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSPrincipalClass</key>
              <string>NSApplication</string>
          </dict>
          </plist>
          EOF
          
          # 2. Объединяем главный бинарник
          echo "🔧 Merging main executable..."
          lipo -create \
            dist_x86_64/MusicLotoMaker.app/Contents/MacOS/MusicLotoMaker \
            dist_arm64/MusicLotoMaker.app/Contents/MacOS/MusicLotoMaker \
            -output dist/MusicLotoMaker.app/Contents/MacOS/MusicLotoMaker
          
          # 3. Объединяем ВСЕ библиотеки в Frameworks
          echo "🔧 Merging ALL frameworks..."
          if [ -d "dist_arm64/MusicLotoMaker.app/Contents/Frameworks" ]; then
            # Копируем структуру
            cp -R dist_arm64/MusicLotoMaker.app/Contents/Frameworks/* dist/MusicLotoMaker.app/Contents/Frameworks/ 2>/dev/null || true
            
            # Объединяем все Mach-O файлы
            find dist_x86_64/MusicLotoMaker.app/Contents/Frameworks -type f 2>/dev/null | while read file; do
              if file "$file" | grep -q "Mach-O"; then
                relative_path="${file#dist_x86_64/MusicLotoMaker.app/Contents/Frameworks/}"
                arm_file="dist_arm64/MusicLotoMaker.app/Contents/Frameworks/$relative_path"
                
                if [ -f "$arm_file" ]; then
                  echo "Merging framework: $relative_path"
                  mkdir -p "$(dirname "dist/MusicLotoMaker.app/Contents/Frameworks/$relative_path")"
                  lipo -create "$file" "$arm_file" -output "dist/MusicLotoMaker.app/Contents/Frameworks/$relative_path"
                fi
              fi
            done
          fi
          
          # 4. Копируем ресурсы (из arm64)
          echo "📁 Copying resources..."
          cp -R dist_arm64/MusicLotoMaker.app/Contents/Resources/* dist/MusicLotoMaker.app/Contents/Resources/ 2>/dev/null || true
          
          # 5. Права доступа и фиксы
          echo "🔒 Setting permissions..."
          chmod +x dist/MusicLotoMaker.app/Contents/MacOS/MusicLotoMaker
          find dist/MusicLotoMaker.app/Contents/Frameworks -name "*.dylib" -exec chmod +x {} \; 2>/dev/null || true
          find dist/MusicLotoMaker.app/Contents/Frameworks -name "*.so" -exec chmod +x {} \; 2>/dev/null || true
          find dist/MusicLotoMaker.app/Contents/Frameworks -name "Python" -exec chmod +x {} \; 2>/dev/null || true
          
          # 6. Ad-hoc подпись (помогает с Gatekeeper)
          echo "📝 Code signing..."
          codesign --force --deep --sign - "dist/MusicLotoMaker.app" 2>/dev/null || echo "Signing skipped but continuing..."
          
          # 7. Очистка расширенных атрибутов
          xattr -cr dist/MusicLotoMaker.app
          
          echo "✅ BULLETPROOF Universal2 app ready"

      - name: Comprehensive verification
        run: |
          echo "🔍 COMPREHENSIVE VERIFICATION:"
          
          echo "📊 Main executable:"
          lipo -info dist/MusicLotoMaker.app/Contents/MacOS/MusicLotoMaker
          
          echo "📊 Checking key binaries:"
          if [ -f "dist/MusicLotoMaker.app/Contents/Frameworks/Python.framework/Versions/3.11/Python" ]; then
            lipo -info dist/MusicLotoMaker.app/Contents/Frameworks/Python.framework/Versions/3.11/Python
          fi
          
          echo "📦 Final app structure:"
          find dist/MusicLotoMaker.app -type f -name "*.dylib" -o -name "*.so" -o -name "Python" | head -10
          
          echo "📦 App size:"
          du -sh dist/MusicLotoMaker.app

      - name: Prepare DMG settings
        run: |
          cat > dmg_settings.py << EOF
          files = ['dist/MusicLotoMaker.app']
          format = 'UDBZ'
          symlinks = {'Applications': '/Applications'}
          window_rect = ((100, 100), (640, 480))
          icon_size = 128
          icon_locations = {
              'MusicLotoMaker.app': (240, 180),
              'Applications': (400, 180)
          }
          EOF

      - name: Build DMG
        run: |
          dmgbuild -s dmg_settings.py "MusicLotoMaker" "MusicLotoMaker.dmg"
          xattr -cr MusicLotoMaker.dmg
          echo "✅ DMG created"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicLotoMaker-Complete-Fix
          path: MusicLotoMaker.dmg