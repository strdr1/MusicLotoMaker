name: Build macOS Universal2 DMG

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller dmgbuild

      - name: Build with PyInstaller (universal2)
        run: |
          echo "🚧 Building MusicLotoMaker.app as Universal2..."
          pyinstaller --noconfirm --windowed --name "MusicLotoMaker" --target-architecture universal2 app.py
          echo "✅ Universal2 build done"

      - name: Verify binary architecture
        run: |
          echo "📊 Проверяем архитектуру исполняемого файла..."
          file dist/MusicLotoMaker.app/Contents/MacOS/MusicLotoMaker
          lipo -info dist/MusicLotoMaker.app/Contents/MacOS/MusicLotoMaker

      - name: Prepare DMG settings
        run: |
          cat > dmg_settings.py << EOF
          files = ['dist/MusicLotoMaker.app']
          format = 'UDBZ'
          symlinks = {'Applications': '/Applications'}
          window_rect = ((100, 100), (640, 480))
          icon_size = 128
          EOF

      - name: Build DMG
        run: |
          dmgbuild -s dmg_settings.py "MusicLotoMaker" "MusicLotoMaker.dmg"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicLotoMaker-dmg
          path: MusicLotoMaker.dmg