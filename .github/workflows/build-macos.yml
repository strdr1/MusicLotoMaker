name: Build macOS DMG (Full Project + Launcher)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dmgbuild
        run: |
          python -m pip install --upgrade pip
          pip install dmgbuild

      - name: Prepare project folder
        run: |
          mkdir dist_project
          cp -R * dist_project || true
          echo "✅ Copied project files into dist_project"

          # Создаём запускающий скрипт
          echo '#!/bin/bash' > dist_project/start.command
          echo 'cd "$(dirname "$0")"' >> dist_project/start.command
          echo 'echo "🚀 Запуск MusicLotoMaker..."' >> dist_project/start.command
          echo 'python3 app.py' >> dist_project/start.command

          chmod +x dist_project/start.command

      - name: Create dmg_settings.py dynamically
        run: |
          echo "files = ['dist_project']" > dmg_settings.py
          echo "format = 'UDBZ'" >> dmg_settings.py
          echo "symlinks = {'Applications': '/Applications'}" >> dmg_settings.py
          echo "window_rect = ((100, 100), (640, 480))" >> dmg_settings.py
          echo "icon_size = 128" >> dmg_settings.py

      - name: Create DMG using dmgbuild
        run: |
          dmgbuild -s dmg_settings.py "MusicLotoMaker" "MusicLotoMaker.dmg"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicLotoMaker-dmg
          path: MusicLotoMaker.dmg
