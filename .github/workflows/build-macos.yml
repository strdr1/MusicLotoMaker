name: Build macOS DMG (Standalone App)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller dmgbuild

      - name: Build standalone app with PyInstaller
        run: |
          echo "🚧 Собираем MusicLotoMaker.app..."
          pyinstaller --noconfirm --windowed --name "MusicLotoMaker" app.py
          echo "✅ PyInstaller закончил сборку"

      - name: Prepare app bundle for DMG
        run: |
          mkdir -p dist_project
          cp -R dist/MusicLotoMaker.app dist_project/
          
          # Добавляем запускалку и текстовый файл
          echo '#!/bin/bash' > dist_project/start.command
          echo 'cd "$(dirname "$0")"' >> dist_project/start.command
          echo 'open MusicLotoMaker.app' >> dist_project/start.command
          chmod +x dist_project/start.command
          
          echo "MusicLotoMaker for macOS" > dist_project/ReadMe.txt
          echo "✅ Готово: dist_project содержит готовое приложение"

      - name: Create dmg_settings.py dynamically
        run: |
          echo "files = ['dist_project']" > dmg_settings.py
          echo "format = 'UDBZ'" >> dmg_settings.py
          echo "symlinks = {'Applications': '/Applications'}" >> dmg_settings.py
          echo "window_rect = ((100, 100), (640, 480))" >> dmg_settings.py
          echo "icon_size = 128" >> dmg_settings.py

      - name: Build DMG with dmgbuild
        run: |
          dmgbuild -s dmg_settings.py "MusicLotoMaker" "MusicLotoMaker.dmg"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicLotoMaker-dmg
          path: MusicLotoMaker.dmg
