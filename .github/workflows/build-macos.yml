name: Build macOS DMG

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller dmgbuild

      - name: Build .app with PyInstaller
        run: |
          pyinstaller --noconfirm --windowed --onefile app.py
          mkdir dist_app
          mv dist/app dist_app/MyApp.app

      - name: Create dmg_settings.py on the fly
        run: |
          echo "application = 'dist_app/MyApp.app'" > dmg_settings.py
          echo "format = 'UDBZ'" >> dmg_settings.py
          echo "files = [application]" >> dmg_settings.py
          echo "symlinks = {'Applications': '/Applications'}" >> dmg_settings.py
          echo "window_rect = ((100, 100), (500, 300))" >> dmg_settings.py
          echo "icon_size = 128" >> dmg_settings.py

      - name: Create DMG using dmgbuild
        run: |
          dmgbuild -s dmg_settings.py "MyApp" "MyApp.dmg"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyApp-dmg
          path: MyApp.dmg
