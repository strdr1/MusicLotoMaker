name: Build macOS DMG (Full Project Tree)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller dmgbuild

      - name: Build standalone app (backend inside)
        run: |
          echo "🚧 Собираем MusicLotoMaker.app..."
          pyinstaller --noconfirm --windowed --name "MusicLotoMaker" app.py
          echo "✅ PyInstaller завершил сборку"

      - name: Prepare dist_project folder
        run: |
          mkdir -p dist_project
          
          # Копируем нужную структуру
          cp -R artists backend frontend assets templates covers game_templates dist_project/ 2>/dev/null || true
          cp -R *.py *.pptx *.json *.txt dist_project/ 2>/dev/null || true
          
          # Добавляем .app собранное
          cp -R dist/MusicLotoMaker.app dist_project/

          # Создаем скрипт запуска для macOS
          echo '#!/bin/bash' > dist_project/start.command
          echo 'cd "$(dirname "$0")"' >> dist_project/start.command
          echo 'echo "🚀 Запуск MusicLotoMaker..."' >> dist_project/start.command
          echo 'python3 app.py' >> dist_project/start.command
          chmod +x dist_project/start.command

          echo "✅ Папка dist_project готова со всей структурой проекта"

      - name: Create dmg_settings.py
        run: |
          echo "files = ['dist_project']" > dmg_settings.py
          echo "format = 'UDBZ'" >> dmg_settings.py
          echo "symlinks = {'Applications': '/Applications'}" >> dmg_settings.py
          echo "window_rect = ((100, 100), (640, 480))" >> dmg_settings.py
          echo "icon_size = 128" >> dmg_settings.py

      - name: Build DMG
        run: |
          dmgbuild -s dmg_settings.py "MusicLotoMaker" "MusicLotoMaker.dmg"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicLotoMaker-dmg
          path: MusicLotoMaker.dmg
